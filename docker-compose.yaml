# Standalone stack: `docker compose up -d` on a laptop, and the CI smoke test.
# NEVER deployed. Publishing ports here is fine — nothing is internet-facing.
# The Coolify variant is docker-compose.coolify.yaml and has no ports: block.

services:
  # Docker creates a named-volume mountpoint root:root 0755 when the path does
  # not exist in the image, and upstream's .dockerignore excludes `db`, so it
  # never does. backend and huey run as 1001:1001 and cannot write there.
  #
  # That is fatal, not cosmetic, and it fails in a thoroughly misleading way:
  # settings.py touches /code/db/idp_oidc_private_key.pem at import time, so
  # every `manage.py` call dies with PermissionError, and startup.sh's
  # `while ! python manage.py showmigrations iam` loop reads that as the
  # database being down and prints "database not ready; waiting" forever. The
  # container stays `running`, gunicorn never binds :8000, and the healthcheck
  # fails until the deploy gives up — which surfaces as
  # "dependency failed to start: container backend is unhealthy" with no hint
  # that permissions were ever involved.
  #
  # Four things need this directory writable: that OIDC key, startup.sh's
  # generated db/django_secret_key, db/attachments (LOCAL_STORAGE_DIRECTORY,
  # so every file upload), and db/huey.db for the worker.
  #
  # Taking ownership once, as root, before anything else starts is the fix.
  # The service exits 0 and stays exited; that is expected, not a crash.
  init-db-perms:
    image: busybox:1.37.0
    # This runs on EVERY deploy, so it has to be idempotent, and that is what
    # decides the capabilities. On a fresh volume root owns /code/db and can
    # chmod it as its owner. On every deploy after the first the directory
    # already belongs to 1001, root is no longer the owner, and chmod then
    # requires CAP_FOWNER. Without it this service works exactly once and exits
    # 1 on every redeploy, taking the whole stack down with it — confirmed live.
    command: ["sh", "-c", "set -e; chown 1001:1001 /code/db; chmod 700 /code/db; ls -ld /code/db"]
    user: "0:0"
    volumes:
      - ciso_db:/code/db
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    mem_limit: 64m
    pids_limit: 16
    restart: "no"
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "1"}

  backend:
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.0.1
    restart: unless-stopped
    depends_on:
      init-db-perms: {condition: service_completed_successfully}
      db: {condition: service_healthy}
    environment:
      # The public hostname comes from ALLOWED_HOSTS; `backend` and `localhost`
      # are appended because Django 400s any Host header absent from the list.
      # The healthcheck below uses Host: localhost and the frontend's
      # server-side calls use Host: backend, so both must be present or the
      # backend never reports healthy and every dependent service times out.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set},backend,localhost
      - CISO_ASSISTANT_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}
      - DJANGO_DEBUG=False
      - AUTH_TOKEN_TTL=7200
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_DATA_HOME=/tmp/.local/share
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_NAME=${POSTGRES_NAME:?POSTGRES_NAME must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ciso_db:/code/db
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 400
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      # Budget: start_period + interval*retries, and the deploy fails the moment
      # it runs out, because everything else gates on this service being healthy.
      # Upstream's 150s + 30*10s = 450s is tuned for their laptop compose on
      # SQLite. A first boot here runs full Postgres migrations and
      # `manage.py storelibraries` on a modest VPS, and overran 450s by seconds
      # on the real server while taking 210s on a CI runner. Interval stays
      # short because the proxy will not route this container until it reports
      # healthy, so a slow interval leaves the app unreachable after every
      # redeploy.
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 300s

  huey:
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.0.1
    restart: unless-stopped
    depends_on:
      init-db-perms: {condition: service_completed_successfully}
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    environment:
      # Same ALLOWED_HOSTS reasoning as the backend service above.
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:?ALLOWED_HOSTS must be set},backend,localhost
      - CISO_ASSISTANT_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}
      - DJANGO_DEBUG=False
      - AUTH_TOKEN_TTL=7200
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_DATA_HOME=/tmp/.local/share
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_NAME=${POSTGRES_NAME:?POSTGRES_NAME must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - DB_HOST=db
      - DB_PORT=5432
    entrypoint: ["/bin/sh", "-c", "python manage.py run_huey -w 2 --scheduler-interval 60"]
    volumes:
      - ciso_db:/code/db
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    image: ghcr.io/intuitem/ciso-assistant-community/frontend:v4.0.1
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    environment:
      - PUBLIC_BACKEND_API_URL=http://backend:8000/api
      - PUBLIC_BACKEND_API_EXPOSED_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}/api
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qdrant:
    image: qdrant/qdrant:v1.14.0
    restart: unless-stopped
    volumes:
      - ciso_qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ciso_caddy:/data/caddy
    environment:
      - CISO_ASSISTANT_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}
    # printf with explicit \n, not a folded block with real newlines: YAML's `>`
    # collapses those into spaces, which put the whole Caddyfile on one line and
    # made caddy crash-loop on `Unexpected '}' ... at Caddyfile:1`. The \n
    # sequences survive folding as two characters and printf turns them into
    # real newlines. %s takes the URL so the value is never word-split.
    command: >
      sh -c 'printf "%s {\n
      reverse_proxy /api/* backend:8000\n
      reverse_proxy /* frontend:3000\n
      tls internal\n
      }\n" "$$CISO_ASSISTANT_URL" > Caddyfile && caddy run'
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The postgres image initialises from POSTGRES_DB; the Django backend reads
      # the same database name from POSTGRES_NAME. Same value, two variable names.
      - POSTGRES_DB=${POSTGRES_NAME:?POSTGRES_NAME must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ wants ONE mount at /var/lib/postgresql and manages the
      # version subdirectory itself. The older /var/lib/postgresql/data path
      # crash-loops the container even against an empty volume.
      - ciso_pgdata:/var/lib/postgresql
    # Postgres drops privileges from root on start; bare cap_drop: ALL breaks
    # that dance, and it writes in too many places for read_only.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ciso_db:
  ciso_pgdata:
  ciso_qdrant:
  ciso_caddy:
