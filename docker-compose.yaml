# Standalone stack: `docker compose up -d` on a laptop, and the CI smoke test.
# NEVER deployed. Publishing ports here is fine — nothing is internet-facing.
# The Coolify variant is docker-compose.coolify.yaml and has no ports: block.

services:
  backend:
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.0.1
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
    environment:
      - ALLOWED_HOSTS=backend,localhost
      - CISO_ASSISTANT_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}
      - DJANGO_DEBUG=False
      - AUTH_TOKEN_TTL=7200
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_DATA_HOME=/tmp/.local/share
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_NAME=${POSTGRES_NAME:?POSTGRES_NAME must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - DB_HOST=db
      - DB_PORT=5432
    volumes:
      - ciso_db:/code/db
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 400
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 150s

  huey:
    image: ghcr.io/intuitem/ciso-assistant-community/backend:v4.0.1
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    environment:
      - ALLOWED_HOSTS=backend,localhost
      - CISO_ASSISTANT_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}
      - DJANGO_DEBUG=False
      - AUTH_TOKEN_TTL=7200
      - HOME=/tmp
      - XDG_CACHE_HOME=/tmp/.cache
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_DATA_HOME=/tmp/.local/share
      - QDRANT_URL=http://qdrant:6333
      - POSTGRES_NAME=${POSTGRES_NAME:?POSTGRES_NAME must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      - DB_HOST=db
      - DB_PORT=5432
    entrypoint: ["/bin/sh", "-c", "python manage.py run_huey -w 2 --scheduler-interval 60"]
    volumes:
      - ciso_db:/code/db
    user: "1001:1001"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  frontend:
    image: ghcr.io/intuitem/ciso-assistant-community/frontend:v4.0.1
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    environment:
      - PUBLIC_BACKEND_API_URL=http://backend:8000/api
      - PUBLIC_BACKEND_API_EXPOSED_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}/api
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  qdrant:
    image: qdrant/qdrant:v1.14.0
    restart: unless-stopped
    volumes:
      - ciso_qdrant:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    depends_on:
      backend: {condition: service_healthy}
      db: {condition: service_healthy}
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ciso_caddy:/data/caddy
    environment:
      - CISO_ASSISTANT_URL=${CISO_ASSISTANT_URL:?CISO_ASSISTANT_URL must be set}
    command: >
      sh -c 'echo $$CISO_ASSISTANT_URL "{
      reverse_proxy /api/* backend:8000
      reverse_proxy /* frontend:3000
      tls internal
      }" > Caddyfile && caddy run'
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      # The postgres image initialises from POSTGRES_DB; the Django backend reads
      # the same database name from POSTGRES_NAME. Same value, two variable names.
      - POSTGRES_DB=${POSTGRES_NAME:?POSTGRES_NAME must be set}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Postgres 18+ wants ONE mount at /var/lib/postgresql and manages the
      # version subdirectory itself. The older /var/lib/postgresql/data path
      # crash-loops the container even against an empty volume.
      - ciso_pgdata:/var/lib/postgresql
    # Postgres drops privileges from root on start; bare cap_drop: ALL breaks
    # that dance, and it writes in too many places for read_only.
    cap_drop: [ALL]
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2.0
    pids_limit: 200
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ciso_db:
  ciso_pgdata:
  ciso_qdrant:
  ciso_caddy:
