name: CI

on:
  push:
  pull_request:

jobs:
  lint-standalone:
    uses: JOduMonT/fleet-toolkit/.github/workflows/compose-lint.yml@v1
    with:
      compose-file: docker-compose.yaml
      env-file: .env.example

  lint-coolify:
    uses: JOduMonT/fleet-toolkit/.github/workflows/compose-lint.yml@v1
    with:
      compose-file: docker-compose.coolify.yaml
      env-file: .env.example

  # The smoke test requires every container to be `running` after a hardcoded
  # 15s settle. This stack gates frontend, huey and caddy behind a backend
  # healthcheck with a 150s start_period, so whether it passes depends on
  # `docker compose up -d` blocking until that condition is met. If this job
  # fails on the first run, the fix is a settle-seconds input on the toolkit
  # workflow, not a change here.
  smoke-test:
    uses: JOduMonT/fleet-toolkit/.github/workflows/compose-smoke-test.yml@v1
    with:
      compose-file: docker-compose.yaml
      env-file: .env.example

  # Temporary. The toolkit smoke test tears the stack down on always(), so a
  # backend that never reports healthy fails with no explanation of why. This
  # brings the same stack up and prints the backend's own log and healthcheck
  # output. Delete once the backend startup failure is understood.
  diagnose-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Start db, qdrant and backend only
        run: |
          set -uo pipefail
          cp .env.example .env
          docker compose -f docker-compose.yaml up -d --no-deps db qdrant backend
          echo "waiting up to 240s for the backend to settle"
          for i in $(seq 1 24); do
            sleep 10
            state=$(docker inspect --format '{{.State.Status}}:{{if .State.Health}}{{.State.Health.Status}}{{else}}nohealth{{end}}' ciso-assistant-backend-1 2>/dev/null || echo gone)
            echo "t=$((i*10))s $state"
            [ "${state%%:*}" = "exited" ] && break
          done
      - name: Backend container log
        if: always()
        run: docker compose -f docker-compose.yaml logs --no-color backend 2>&1 | tail -100
      - name: Backend healthcheck probe output
        if: always()
        run: |
          docker inspect --format '{{json .State.Health}}' ciso-assistant-backend-1 2>/dev/null \
            | python3 -m json.tool 2>/dev/null | tail -40 || echo "no health state"
      - name: Probe the health endpoint directly
        if: always()
        run: |
          docker exec ciso-assistant-backend-1 \
            curl -sS -o /dev/null -w 'health endpoint -> %{http_code}\n' \
            http://localhost:8000/api/health/ 2>&1 || echo "exec/curl failed"
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yaml down -v
